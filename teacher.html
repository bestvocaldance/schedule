<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>베스트보컬&댄스 선생님 스케줄 (보기 전용)</title>
<style>body{margin:0;font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;background:#1a202c;color:#e2e8f0}
#tv-boot{display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px;line-height:1.7;font-size:15px}</style>
</head>
<body>
<div id="tv-boot">선생님 스케줄을 불러오는 중입니다…</div>
<script>
/* 선생님용 보기 전용 스케줄.
   · 부원장님이 쓰는 스케줄 화면(index.html)을 그대로 가져와서 "보기만" 되게 바꿔 보여 줍니다.
     그래서 수업·색·표시가 편집 화면과 항상 똑같고, 편집 화면을 고쳐도 이 파일은 손댈 필요가 없습니다.
   · 저장 요청은 화면 버튼을 막는 것과 별개로, 서버로 나가는 길목에서 한 번 더 막습니다.
   · 보기 전용으로 바꾸는 데 필요한 자리를 못 찾으면, 편집 가능한 화면을 띄우지 않고 멈춥니다. */
(function () {
  'use strict';
  function stop(msg) { var b = document.getElementById('tv-boot'); if (b) b.textContent = msg; }
  // 폰에서 처음 여는 선생님은 요일별(모바일) 화면이 기본입니다. 한 번 바꾸면 그 선택이 유지됩니다.
  try { if (!localStorage.getItem('bvd_sched_view')) localStorage.setItem('bvd_sched_view', 'mobile'); } catch (e) {}

  // ① 서버로 나가는 길목: 읽기(loadAllData, getWeekAttendance)만 통과시킵니다.
  var GUARD = '<script>(' + function () {
    var ALLOW = { loadAllData: 1, getWeekAttendance: 1 };
    var realFetch = window.fetch;
    window.fetch = function (url, opt) {
      var u = String(url && url.url ? url.url : url);
      if (u.indexOf('/functions/v1/') >= 0) {
        var fn = '';
        try { fn = JSON.parse(opt && opt.body ? opt.body : '{}').fn || ''; } catch (e) { fn = ''; }
        if (!ALLOW[fn]) return Promise.reject(new Error('READ_ONLY: 보기 전용 화면입니다.'));
      } else if (u.indexOf('/rest/v1/') >= 0) {
        return Promise.reject(new Error('READ_ONLY: 보기 전용 화면입니다.')); // 수업체크 특이사항은 선생님 화면에 싣지 않습니다
      }
      return realFetch.apply(this, arguments);
    };
    var real = window.google && window.google.script && window.google.script.run;
    function runner(ok, fail) {
      return new Proxy({}, { get: function (_, name) {
        if (name === 'withSuccessHandler') return function (f) { return runner(f, fail); };
        if (name === 'withFailureHandler') return function (f) { return runner(ok, f); };
        if (name === 'withUserObject') return function () { return runner(ok, fail); };
        return function () {
          if (!ALLOW[name] || !real) { if (fail) setTimeout(function () { fail(new Error('READ_ONLY: 보기 전용 화면입니다.')); }, 0); return; }
          var r = real; if (ok) r = r.withSuccessHandler(ok); if (fail) r = r.withFailureHandler(fail);
          r[name].apply(r, arguments);
        };
      } });
    }
    window.google = window.google || {}; window.google.script = window.google.script || {};
    window.google.script.run = runner(null, null);
    window.__BVD_VIEW_ONLY = true;
  } + ')();<\/script>';

  // ② 화면: 수정으로 이어지는 조작을 모두 막고, 선생님 이름 선택을 붙입니다.
  var ADDON = '<style>' +
    '.header-right .hbtn[onclick^="openModal"],.header-right .hbtn[onclick^="openMemberPanel"],#tts-btn,#tts-fab,#notif-btn,.mobile-fab,[onclick="openModal()"],#mobile-grid button,' +
    '#bvd-pay-strip,.bvd-pay-chip,#bvd-sync-notice,.ctx-menu,#modal-bg,#sub-modal-bg,#member-panel,#member-overlay{display:none!important}' +
    '.stu-card,.mg-card{cursor:default!important}' +
    '#tv-bar{flex-shrink:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;background:#ebf4ff;border-bottom:1px solid #bee3f8;color:#2a4365;font-size:12px}' +
    '#tv-bar b{white-space:nowrap}#tv-bar select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid #90cdf4;border-radius:6px;background:#fff;color:#1a202c;max-width:60vw}' +
    '#tv-bar .tv-ro{margin-left:auto;padding:2px 8px;border-radius:9px;background:#2b6cb0;color:#fff;font-weight:700;white-space:nowrap}' +
    '</style><script>(' + function () {
    if (!window.__BVD_VIEW_ONLY) { document.documentElement.innerHTML = '<body style="font-family:sans-serif;padding:24px">보기 전용 화면을 준비하지 못했습니다. 학원으로 알려 주세요.</body>'; return; }
    var KEY = 'bvd_teacher_view_name', sel = '';
    try { sel = localStorage.getItem(KEY) || ''; } catch (e) {}
    function teachersOf(e) {
      var out = [], sub = (typeof getSubTeacher === 'function') ? getSubTeacher(e) : '';
      if (sub) out.push(String(sub).trim());
      String(e.teacherName || '').split(/[\/,]/).forEach(function (t) { t = t.trim(); if (t && out.indexOf(t) < 0) out.push(t); });
      return out;
    }
    var _vs = visibleSchedule;
    function allVisible() { return _vs.apply(window, arguments); }
    visibleSchedule = function () {
      var list = allVisible();
      if (!sel) return list;
      return list.filter(function (e) { return teachersOf(e).indexOf(sel) >= 0; });
    };
    // 이름 선택 줄
    var bar = document.createElement('div'); bar.id = 'tv-bar';
    var lab = document.createElement('b'); lab.textContent = '선생님';
    var pick = document.createElement('select'); pick.id = 'tv-teacher'; pick.setAttribute('aria-label', '선생님 선택');
    var ro = document.createElement('span'); ro.className = 'tv-ro'; ro.textContent = '보기 전용';
    bar.appendChild(lab); bar.appendChild(pick); bar.appendChild(ro);
    var stats = document.getElementById('stats');
    if (stats && stats.parentNode) stats.parentNode.insertBefore(bar, stats); else document.body.insertBefore(bar, document.body.firstChild);
    function fillPick() {
      var names = {};
      (typeof schedule !== 'undefined' && schedule ? schedule : []).forEach(function (e) { teachersOf(e).forEach(function (n) { names[n] = 1; }); });
      if (sel) names[sel] = 1;
      var list = Object.keys(names).sort(function (a, b) { return a.localeCompare(b, 'ko'); });
      var sig = list.join('|'); if (pick.getAttribute('data-sig') === sig) { pick.value = sel; return; }
      pick.setAttribute('data-sig', sig); pick.innerHTML = '';
      var o = document.createElement('option'); o.value = ''; o.textContent = '전체 수업 보기'; pick.appendChild(o);
      list.forEach(function (n) { var x = document.createElement('option'); x.value = n; x.textContent = n + ' 선생님 수업만'; pick.appendChild(x); });
      pick.value = sel;
    }
    pick.addEventListener('change', function () { sel = pick.value; try { localStorage.setItem(KEY, sel); } catch (e) {} renderAll(); });
    var _renderAll = renderAll;
    renderAll = function () { var r = _renderAll.apply(this, arguments); try { fillPick(); } catch (e) {} return r; };
    fillPick();
    try { document.title = '선생님 스케줄 (보기 전용)'; } catch (e) {}

    // 조작 막기: 아래 "허용 목록" 밖에서 일어난 누르기·끌기·오른쪽 클릭·키 입력은 화면 코드에 전달하지 않습니다.
    var OK_SEL = '#tv-bar, .week-nav, .day-tabs, #view-toggle-btn, .hbtn.gray, .search-wrap, #search-panel .sp-hdr-close, #search-clear, button[style*="position:fixed"][style*="left:10px"]';
    function allowed(t) { return !!(t && t.closest && t.closest(OK_SEL)); }
    ['click', 'dblclick', 'contextmenu', 'mousedown', 'mouseup', 'pointerdown', 'pointerup', 'touchstart', 'touchend', 'dragstart', 'dragover', 'drop'].forEach(function (type) {
      document.addEventListener(type, function (ev) {
        if (allowed(ev.target)) return;
        ev.stopImmediatePropagation();
        if (type === 'contextmenu' || type === 'dragstart' || type === 'drop' || type === 'click' || type === 'dblclick') ev.preventDefault();
      }, true);
    });
    document.addEventListener('keydown', function (ev) {
      var t = ev.target, typing = t && (t.id === 'search-inp' || t.id === 'tv-teacher');
      if (!typing) ev.stopImmediatePropagation();
    }, true);
    // 저장하지 않은 변경이 있을 수 없으므로 "나가시겠습니까" 창도 뜨지 않게 합니다.
    window.addEventListener('beforeunload', function (ev) { ev.stopImmediatePropagation(); }, true);
  } + ')();<\/script>';

  fetch('index.html?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function (html) {
    var shim = /<script src="shim\.js[^"]*"><\/script>/;
    var end = html.lastIndexOf('</body>');
    if (!shim.test(html) || end < 0) { stop('보기 전용 화면을 준비하지 못했습니다. 학원으로 알려 주세요. (구성이 바뀜)'); return; }
    html = html.slice(0, end) + ADDON + html.slice(end);   // 화면 맨 끝에 보기 전용 처리를 붙입니다
    html = html.replace(shim, function (m) { return m + GUARD; });
    document.open(); document.write(html); document.close();
  }).catch(function () { stop('스케줄을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로 고쳐 주세요.'); });
})();
</script>
</body>
</html>
