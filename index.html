<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="shim.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>베스트보컬&댄스 스케줄</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;background:#f0f4f8;color:#1a202c;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.header{background:#1a202c;color:white;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.logo h1{font-size:14px;font-weight:800;white-space:nowrap;}
.logo h1 span{color:#63b3ed;}
.week-nav{display:flex;align-items:center;gap:3px;background:#2d3748;border-radius:16px;padding:3px 8px;flex-shrink:0;}
.week-btn{background:none;border:none;color:#a0aec0;font-size:16px;cursor:pointer;padding:0 3px;line-height:1;}
.week-btn:hover{color:white;}
.week-label{font-size:11px;color:#e2e8f0;white-space:nowrap;min-width:100px;text-align:center;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:6px;}
.hbtn{background:#4299e1;color:white;border:none;border-radius:14px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;}
.hbtn.gray{background:#4a5568;}
.search-wrap{position:relative;}
.hsearch-inp{background:#2d3748;border:1px solid #4a5568;color:white;border-radius:14px;padding:4px 26px 4px 10px;font-size:11px;font-family:inherit;outline:none;width:130px;transition:width 0.2s;}
.hsearch-inp::placeholder{color:#718096;}
.hsearch-inp:focus{border-color:#63b3ed;width:160px;}
.search-clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:none;border:none;color:#718096;font-size:12px;cursor:pointer;display:none;}
.search-clear.show{display:block;}
.notif-btn{position:relative;background:none;border:none;color:#a0aec0;font-size:18px;cursor:pointer;padding:3px;}
.notif-btn.has-alert{color:#f6ad55;}
.notif-badge{position:absolute;top:0;right:0;background:#e53e3e;color:white;font-size:8px;font-weight:800;width:13px;height:13px;border-radius:50%;display:none;align-items:center;justify-content:center;border:1.5px solid #1a202c;}
.notif-badge.show{display:flex;}
.stats{display:flex;gap:4px;padding:4px 10px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;background:white;border-bottom:1px solid #e2e8f0;}
.stats::-webkit-scrollbar{display:none;}
.stat{border-radius:4px;padding:2px 7px;font-size:10px;color:#4a5568;white-space:nowrap;flex-shrink:0;background:#f7fafc;}
.stat b{color:#1a202c;}
.stat-sep{width:1px;background:#e2e8f0;margin:0 2px;flex-shrink:0;}
.day-tabs{display:none;background:#2d3748;padding:0 8px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tabs-inner{display:flex;gap:4px;padding:5px 0;}
.day-tab{flex-shrink:0;background:none;border:1px solid #4a5568;color:#a0aec0;border-radius:8px;padding:4px 10px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;}
.day-tab .tab-day{display:block;font-size:11px;}
.day-tab .tab-date{display:block;font-size:8px;color:#718096;}
.day-tab .tab-cnt{display:block;font-size:8px;color:#718096;}
.day-tab.active{background:#4299e1;border-color:#4299e1;color:white;}
.day-tab.active .tab-date,.day-tab.active .tab-cnt{color:rgba(255,255,255,0.75);}
.day-tab.has-alert{border-color:#f6ad55;}
.main{flex:1;overflow:hidden;}
.weekly-scroll{width:100%;height:100%;overflow:auto;background:#f0f4f8;}
.schedule-table{border-collapse:collapse;table-layout:fixed;background:white;}
.schedule-table th,.schedule-table td{border:1px solid #e2e8f0;}
.th-corner{position:sticky;left:0;top:0;z-index:50;background:#1a202c;color:#718096;font-size:9px;text-align:center;padding:4px 2px;min-width:50px;width:50px;}
.th-day{position:sticky;top:0;z-index:40;text-align:center;padding:5px 4px;font-size:12px;font-weight:800;color:white;white-space:nowrap;cursor:pointer;}
.th-day:hover{filter:brightness(1.2);}
.th-day.d0{background:#2b6cb0;}.th-day.d1{background:#c05621;}.th-day.d2{background:#276749;}.th-day.d3{background:#553c9a;}.th-day.d4{background:#9b2c2c;}.th-day.d5{background:#975a16;}
.th-teacher{position:sticky;top:28px;z-index:40;background:#f7fafc;text-align:center;font-size:10px;font-weight:700;color:#2d3748;padding:3px 4px;white-space:nowrap;min-width:92px;width:92px;}
.th-teacher.d0{border-top:2px solid #2b6cb0;}.th-teacher.d1{border-top:2px solid #c05621;}.th-teacher.d2{border-top:2px solid #276749;}.th-teacher.d3{border-top:2px solid #553c9a;}.th-teacher.d4{border-top:2px solid #9b2c2c;}.th-teacher.d5{border-top:2px solid #975a16;}
.th-sep{position:sticky;top:0;z-index:40;background:#2d3748;width:5px;min-width:5px;padding:0;border:none;}
.td-sep{background:#2d3748;padding:0;border:none;width:5px;}
.td-time{position:sticky;left:0;z-index:30;background:#edf2f7;text-align:right;font-size:9px;color:#718096;padding:2px 5px;white-space:nowrap;width:50px;min-width:50px;height:18px;}
.td-time.hour{background:#e2e8f0;color:#2d3748;font-weight:800;font-size:10px;border-top:2px solid #cbd5e0;height:22px;}
.td-time.half{background:#f0f4f8;color:#4a5568;font-size:9px;border-top:1px solid #dde3ea;}
.td-slot{min-width:92px;width:92px;padding:0;vertical-align:top;height:18px;}
.td-slot.hour{border-top:2px solid #e2e8f0;height:22px;}
.td-slot.half{border-top:1px dashed #e8ecf2;}
.td-slot.search-hi{background:#fffbeb !important;}
.td-slot.d0{background:#f0f7ff;}.td-slot.d1{background:#fff8f0;}.td-slot.d2{background:#f0fff6;}.td-slot.d3{background:#f6f0ff;}.td-slot.d4{background:#fff0f0;}.td-slot.d5{background:#fffff0;}
.stu-card{border-radius:4px;padding:5px 5px 5px 8px;font-size:10px;cursor:pointer;border-left:4px solid transparent;position:relative;width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-start;}
.stu-card:hover{opacity:0.85;}
.stu-name{font-weight:700;font-size:11px;line-height:1.3;}
.stu-class{font-size:9px;opacity:0.75;line-height:1.2;margin-top:2px;}
.stu-time{font-size:8px;color:#888;margin-top:2px;}
.stu-badge{position:absolute;top:3px;right:4px;font-size:8px;font-weight:700;}
.stu-sub{font-size:8px;font-weight:700;color:#b7791f;margin-top:2px;}
.compact-area{display:none;width:100%;height:100%;overflow:auto;}
.compact-table{border-collapse:collapse;min-width:560px;width:100%;}
.compact-table th,.compact-table td{border:1px solid #e2e8f0;}
.ct-corner{position:sticky;left:0;top:0;z-index:50;background:#1a202c;color:#718096;font-size:9px;text-align:center;padding:4px 2px;width:62px;min-width:62px;}
.ct-day{position:sticky;top:0;z-index:40;background:#2d3748;color:white;text-align:center;padding:5px 4px;font-size:11px;font-weight:700;cursor:pointer;min-width:110px;}
.ct-day:hover{background:#4a5568;}
.ct-day .dn{display:block;font-size:12px;font-weight:800;}
.ct-day .dd{display:block;font-size:9px;color:#a0aec0;margin-top:1px;}
.ct-day .dc{display:block;font-size:9px;color:#a0aec0;}
.ct-day .hint{display:block;font-size:9px;color:#63b3ed;margin-top:2px;}
.ct-time{position:sticky;left:0;z-index:30;background:#edf2f7;text-align:right;font-size:9px;color:#718096;padding:2px 5px;width:62px;min-width:62px;white-space:nowrap;height:18px;}
.ct-time.hour{background:#e2e8f0;color:#2d3748;font-weight:800;font-size:10px;border-top:2px solid #cbd5e0;height:22px;}
.ct-time.half{background:#f0f4f8;color:#4a5568;border-top:1px solid #dde3ea;}
.ct-slot{padding:2px;min-height:18px;vertical-align:top;min-width:110px;}
.ct-slot.hour{border-top:2px solid #e2e8f0;}
.ct-slot.half{border-top:1px dashed #e8ecf2;}
.ct-slot.has-cls{cursor:pointer;}
.ct-slot.has-cls:hover{background:#f0f9ff;}
.ct-slot.search-hi{background:#fffbeb !important;}
.dot-row{display:flex;flex-wrap:wrap;gap:2px;}
.dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.dot-more{font-size:8px;font-weight:700;color:#718096;align-self:center;margin-left:1px;}
.dv-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:8000;display:none;align-items:center;justify-content:center;padding:10px;}
.dv-bg.show{display:flex;}
.dv-modal{background:#f0f4f8;border-radius:14px;width:100%;max-width:920px;height:calc(100vh - 20px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 60px rgba(0,0,0,0.4);}
.dv-hdr{background:#1a202c;color:white;padding:10px 14px;display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap;}
.dv-title{font-size:15px;font-weight:800;flex:1;min-width:160px;}
.dv-sub{font-size:10px;color:#a0aec0;display:block;font-weight:400;}
.dv-btn{border:none;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
.dv-btn.green{background:#276749;color:white;}
.dv-btn.blue{background:#4299e1;color:white;}
.dv-btn.gray{background:#4a5568;color:#e2e8f0;}
.dv-btn.gold{background:#F4C430;color:#1a202c;}
.dv-btn.gold:hover{opacity:0.85;}
.dv-btn.gold:disabled{opacity:0.5;cursor:not-allowed;}
.dv-btn.purple{background:#1a202c;color:#F4C430;border:1px solid #F4C430;}
.dv-btn.purple:hover{background:#F4C430;color:#1a202c;}
.dv-body{flex:1;overflow:auto;padding:10px;}
.dv-tbl{border-collapse:collapse;background:white;width:100%;}
.dv-tbl th,.dv-tbl td{border:1px solid #e2e8f0;}
.dv-cap-row td{background:#1a202c;padding:10px 14px;}
.dv-th-c{background:#1a202c;color:#718096;font-size:9px;text-align:center;padding:5px 3px;width:58px;min-width:58px;}
.dv-th-t{background:#f7fafc;text-align:center;font-size:11px;font-weight:700;color:#2d3748;padding:6px 8px;min-width:120px;}
.dv-td-tm{background:#edf2f7;text-align:right;font-size:9px;color:#718096;padding:3px 5px;white-space:nowrap;width:58px;height:18px;}
.dv-td-tm.hour{background:#e2e8f0;color:#2d3748;font-weight:800;border-top:2px solid #cbd5e0;height:22px;}
.dv-td-tm.half{background:#f0f4f8;color:#4a5568;border-top:1px solid #dde3ea;}
.dv-td-sl{padding:0;min-height:18px;vertical-align:top;}
.dv-td-sl.hour{border-top:2px solid #e2e8f0;}
.dv-td-sl.half{border-top:1px dashed #e8ecf2;}
.img-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9500;display:none;align-items:center;justify-content:center;padding:16px;}
.img-bg.show{display:flex;}
.img-modal{background:white;border-radius:16px;width:100%;max-width:580px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 50px rgba(0,0,0,0.35);}
.img-hdr{background:#1a202c;color:white;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.img-hdr span{font-size:14px;font-weight:800;}
.img-hdr button{background:none;border:none;color:#a0aec0;font-size:20px;cursor:pointer;}
.img-scroll{flex:1;overflow:auto;padding:12px;background:#e2e8f0;display:flex;justify-content:center;}
.img-scroll canvas{max-width:100%;border-radius:8px;display:block;box-shadow:0 4px 16px rgba(0,0,0,0.2);}
.img-acts{display:flex;gap:8px;padding:12px 14px;border-top:1px solid #e2e8f0;background:white;flex-shrink:0;}
.img-acts button{flex:1;padding:10px;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:white;border-radius:14px;padding:20px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,0.2);}
.modal h3{font-size:15px;font-weight:800;margin-bottom:14px;}
.form-row{margin-bottom:10px;}
.form-row label{display:block;font-size:11px;font-weight:600;color:#4a5568;margin-bottom:3px;}
.form-row input,.form-row select{width:100%;border:2px solid #e2e8f0;border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;outline:none;}
.form-row input:focus,.form-row select:focus{border-color:#4299e1;}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.onetime-row{display:flex;align-items:center;gap:8px;background:#fffbeb;border:1.5px solid #fde68a;border-radius:8px;padding:8px 10px;margin-bottom:10px;cursor:pointer;}
.onetime-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:#d69e2e;flex-shrink:0;}
.onetime-label strong{display:block;font-size:11px;font-weight:700;color:#b7791f;}
.onetime-label span{display:block;font-size:9px;color:#92400e;}
.modal-btns{display:flex;gap:8px;margin-top:14px;}
.modal-btn{flex:1;padding:9px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.modal-btn.primary{background:#1a202c;color:white;}
.modal-btn.cancel{background:#e2e8f0;color:#4a5568;}
.ctx-menu{position:fixed;z-index:9999;background:white;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.15);padding:5px 0;min-width:182px;font-size:12px;}
.ctx-item{padding:8px 13px;cursor:pointer;color:#1a202c;display:flex;align-items:center;gap:7px;}
.ctx-item:hover{background:#f7fafc;}
.ctx-item.danger{color:#c53030;}
.ctx-item.danger:hover{background:#fff5f5;}
.ctx-sep{height:1px;background:#e2e8f0;margin:3px 0;}
.mobile-panel{display:none;position:fixed;inset:0;background:white;z-index:200;flex-direction:column;overflow:hidden;}
.mobile-panel.show{display:flex;}
.mp-header{background:#1a202c;color:white;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.mp-title{font-size:14px;font-weight:700;}
.mp-close{background:none;border:none;color:white;font-size:20px;cursor:pointer;}
.mp-body{flex:1;overflow-y:auto;padding:12px 14px;}
.msg-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:6000;display:none;align-items:center;justify-content:center;padding:16px;}
.msg-modal-bg.show{display:flex;}
.msg-modal{background:white;border-radius:16px;width:100%;max-width:460px;box-shadow:0 8px 40px rgba(0,0,0,0.25);overflow:hidden;}
.msg-modal-header{background:#1a202c;color:white;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;}
.msg-modal-title{font-size:14px;font-weight:800;}
.msg-modal-close{background:none;border:none;color:#a0aec0;font-size:20px;cursor:pointer;}
.msg-tabs{display:flex;border-bottom:2px solid #e2e8f0;}
.msg-tab{flex:1;padding:9px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;color:#718096;background:#f7fafc;border:none;font-family:inherit;}
.msg-tab.active{color:#1a202c;background:white;border-bottom:2px solid #4299e1;margin-bottom:-2px;}
.msg-body{padding:14px;}
.msg-info{font-size:10px;color:#718096;margin-bottom:7px;}
.msg-textarea{width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:10px;font-size:12px;font-family:inherit;line-height:1.7;resize:none;outline:none;min-height:160px;}
.msg-actions{display:flex;gap:8px;margin-top:10px;}
.msg-copy-btn{flex:1;padding:10px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;background:#4299e1;color:white;}
.msg-copy-btn.copied{background:#48bb78;}
.msg-close-btn{padding:10px 15px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;background:#e2e8f0;color:#4a5568;}
.loading-overlay{position:fixed;inset:0;background:#1a202c;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;}
.loading-logo{font-size:26px;font-weight:800;color:white;}
.loading-logo span{color:#63b3ed;}
.loading-bar-wrap{width:160px;height:3px;background:#2d3748;border-radius:3px;overflow:hidden;margin-top:16px;}
.loading-bar{height:100%;background:#4299e1;border-radius:3px;animation:ldbar 1.2s ease-in-out infinite;}
@keyframes ldbar{0%{transform:translateX(-100%)}100%{transform:translateX(500%)}}
.loading-txt{font-size:11px;color:#718096;margin-top:10px;}
.sub-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;}
.sub-modal-bg.show{display:flex;}
.mobile-scroll{width:100%;height:100%;overflow-y:auto;display:none;}
.mobile-grid{display:grid;grid-template-columns:50px 1fr;}
.mobile-fab{display:none;position:fixed;bottom:18px;right:18px;background:#4299e1;color:white;border:none;border-radius:50%;width:50px;height:50px;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(66,153,225,0.5);z-index:100;font-family:inherit;}
.tts-fab{display:none;position:fixed;bottom:78px;right:18px;background:#805ad5;color:white;border:none;border-radius:50%;width:50px;height:50px;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(128,90,213,0.5);z-index:100;font-family:inherit;align-items:center;justify-content:center;}
.notif-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid #fde68a;background:#fffbeb;margin-bottom:5px;}
.notif-item-info{flex:1;}
.notif-item-name{font-size:12px;font-weight:700;color:#b7791f;}
.notif-item-detail{font-size:10px;color:#92400e;margin-top:1px;}
.notif-done-btn{background:#276749;color:white;border:none;border-radius:6px;padding:4px 8px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;}
.mg-th{position:sticky;top:0;z-index:10;background:#2d3748;color:white;padding:6px;text-align:center;font-size:12px;font-weight:700;border-bottom:2px solid #1a202c;}
.mg-tc{padding:0 5px;text-align:right;font-size:9px;color:#a0aec0;background:#f7fafc;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:flex-end;min-height:18px;}
.mg-tc.hour{background:#edf2f7;color:#4a5568;font-weight:700;border-top:1px solid #e2e8f0;min-height:22px;}
.mg-tc.half{background:#f0f4f8;color:#555;border-top:1px solid #dde3ea;}
.mg-sc{border-bottom:1px solid #e2e8f0;min-height:18px;padding:2px 4px;}
.mg-sc.hour{border-top:1px solid #e2e8f0;min-height:22px;}
.mg-sc.half{border-top:1px dashed #e8ecf2;}
.mg-card{border-radius:5px;padding:4px 8px 4px 9px;margin-bottom:3px;font-size:11px;border-left:4px solid transparent;cursor:pointer;position:relative;}
.mg-card .mg-sn{font-weight:700;font-size:12px;}
.mg-card .mg-tn{font-size:10px;opacity:0.65;}
.mg-card .mg-ct{font-size:10px;opacity:0.8;}
.mg-img-btn{background:#4299e1;border:none;color:white;border-radius:8px;padding:3px 10px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;margin-left:6px;}
.dp-empty{text-align:center;padding:28px 0;color:#a0aec0;font-size:12px;}
.search-panel{position:fixed;top:0;right:-340px;width:320px;height:100vh;background:white;z-index:9000;box-shadow:-4px 0 20px rgba(0,0,0,0.18);display:flex;flex-direction:column;transition:right 0.28s cubic-bezier(.4,0,.2,1);}
.search-panel.show{right:0;}
.sp-hdr{background:#1a202c;color:white;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.sp-hdr-title{font-size:13px;font-weight:800;}
.sp-hdr-close{background:none;border:none;color:#a0aec0;font-size:20px;cursor:pointer;line-height:1;}
.sp-meta{padding:10px 14px 6px;border-bottom:1px solid #e2e8f0;flex-shrink:0;}
.sp-name{font-size:15px;font-weight:800;color:#1a202c;}
.sp-count{font-size:11px;color:#718096;margin-top:2px;}

// Schedule sync v3 — confirmed baseline, one request at a time, no sample fallback.
var bvdBase=null,bvdDirty=false,bvdEditGeneration=0,bvdLoadGeneration=0,bvdSavePromise=null;
function bvdClone(x){return JSON.parse(JSON.stringify(x));}
function bvdSnapshot(){return {schedule:bvdClone(schedule),overrides:bvdClone(weekOverrides)};}
function bvdEqual(a,b){return JSON.stringify(a==null?'':a)===JSON.stringify(b==null?'':b);}
function bvdNotice(message,error){
  var el=document.getElementById('bvd-sync-notice');
  if(!el){el=document.createElement('div');el.id='bvd-sync-notice';el.style.cssText='position:fixed;top:60px;left:10px;right:10px;z-index:100001;padding:12px;background:#fff5f5;color:#9b2c2c;border:1px solid #fc8181;border-radius:8px;font-size:13px;white-space:pre-wrap;';document.body.appendChild(el);}

}
function bvdError(err){
  var s=String(err&&(err.message||err)||'');

  if(s.indexOf('WEEK_STATUS_STORAGE_FULL')>=0)return '취소·보강 기록 저장 공간이 부족합니다. 저장하지 못했습니다. 관리자에게 알려주세요.';

// Reapply only edits made while the previous request was in flight.
function bvdRebase(server,sent,local){
  var result=bvdClone(server),by={},before={};
  result.schedule.forEach(function(r){by[r.id]=r;});sent.schedule.forEach(function(r){before[r.id]=r;});
  local.schedule.forEach(function(r){
    var prev=before[r.id];
    if(!prev){result.schedule.push(bvdClone(r));return;}
    if(!by[r.id])return;
    Object.keys(r).forEach(function(k){if(k!=='updatedAt'&&!bvdEqual(prev[k],r[k]))by[r.id][k]=r[k];});
  });
  var a=sent.overrides||{},b=local.overrides||{};
  Object.keys(Object.assign({},a,b)).forEach(function(w){Object.keys(Object.assign({},a[w],b[w])).forEach(function(k){
    var av=(a[w]||{})[k],bv=(b[w]||{})[k];if(bvdEqual(av,bv))return;

}
function saveAll(){
  bvdEditGeneration++;bvdDirty=true;
  if(loadFailed||!bvdBase){bvdNotice('시간표를 정상적으로 불러온 뒤 수정해주세요. 현재 변경은 저장되지 않았습니다.',true);return Promise.resolve(false);}
  if(bvdSavePromise)return bvdSavePromise;
  window.__bvdSaving=true;
  bvdSavePromise=new Promise(function(resolve){
    function flush(){
      var sent=bvdSnapshot(),generation=bvdEditGeneration;
      var payload=JSON.stringify({protocol:3,base:bvdBase,next:sent}),attempt=0;
      showSave(true);bvdNotice('',false);
      function failed(err){
        window.__bvdSaving=false;bvdSavePromise=null;bvdDirty=true;
        showSave(false,'저장 실패');bvdNotice(bvdError(err),true);resolve(false);
      }
      function run(){
        attempt++;

          var data;

          if(changed){flush();return;}
          bvdDirty=false;window.__bvdSaving=false;bvdSavePromise=null;
          renderAll();showSave(false,'저장 완료!');bvdNotice('',false);resolve(true);
        }).withFailureHandler(function(err){
          if(String(err&&(err.message||err)).indexOf('SAVE_LOCK_TIMEOUT')>=0&&attempt<3){setTimeout(run,1500*attempt);return;}
          failed(err);
        }).saveScheduleV3(payload);}catch(e){failed(e);}
      }run();
    }flush();
  });return bvdSavePromise;
}
function loadAll(){
  if(window.__bvdSaving||bvdDirty)return Promise.resolve(false);
  var generation=bvdEditGeneration,request=++bvdLoadGeneration;
  return new Promise(function(resolve){
    function failed(){
      if(request===bvdLoadGeneration&&!bvdDirty&&!window.__bvdSaving){
        if(!bvdBase)loadFailed=true;
        bvdNotice(bvdBase?'최신 시간표를 불러오지 못했습니다. 마지막으로 확인한 내용을 표시합니다.':'시간표를 불러오지 못했습니다. 다시 불러오기를 눌러주세요.',true);

    }
    try{google.script.run.withSuccessHandler(function(raw){
      if(request!==bvdLoadGeneration||generation!==bvdEditGeneration||bvdDirty||window.__bvdSaving){resolve(false);return;}

        var data=JSON.parse(raw);

  });
}
function reloadData(automatic){
  if(window.__bvdSaving)return Promise.resolve(false);

    if(automatic===true)return Promise.resolve(false);
    if(!confirm('아직 저장되지 않은 변경이 있습니다. 이 화면의 미저장 변경을 버리고 서버의 최신 시간표를 불러올까요?'))return Promise.resolve(false);

    var savedLocal=bvdSnapshot();bvdDirty=false;
    return loadAll().then(function(ok){if(!ok){schedule=savedLocal.schedule;weekOverrides=savedLocal.overrides;bvdDirty=true;}renderAll();return ok;});
  }

}

function buildDvTable(day,date,teachers,entries){
  var di=DAYS.indexOf(day),dc=DAY_COLORS[di]||'#4299e1';
  var tbl=document.createElement('table');
  tbl.className='dv-tbl';
  var capTr=document.createElement('tr');
  capTr.className='dv-cap-row';
  var capTd=document.createElement('td');
  capTd.colSpan=teachers.length+1;
  capTd.innerHTML='<span style="color:white;font-size:15px;font-weight:800;">베스트보컬&댄스</span><span style="color:'+dc+';font-size:13px;font-weight:700;margin-left:10px;">'+day+'요일 스케줄</span><span style="color:#a0aec0;font-size:11px;float:right;margin-top:3px;">'+fmtDateShort(date)+'</span>';
  capTr.appendChild(capTd);
  var thead=document.createElement('thead');
  thead.appendChild(capTr);
  var trh=document.createElement('tr');
  var co=document.createElement('th');
  co.className='dv-th-c';co.textContent='시간';trh.appendChild(co);
  teachers.forEach(function(teacher){
    var cnt=entries.filter(function(e){return(getSubTeacher(e)||e.teacherName||'미정')===teacher;}).length;
    var th=document.createElement('th');
    th.className='dv-th-t';
    th.style.borderTop='3px solid '+dc;
    th.innerHTML=teacher+'T <span style="font-size:9px;color:#718096;font-weight:400;">('+cnt+'개)</span>';
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  tbl.appendChild(thead);
  var skipMap={};
  var tj,ti,ei,ri;
  for(tj=0;tj<teachers.length;tj++){
    var teacher=teachers[tj];
    for(ti=0;ti<TIMES.length;ti++){
      var t=TIMES[ti];
      var maxEndIdx=ti;
      for(ei=0;ei<entries.length;ei++){
        var e=entries[ei];
        if(e.time!==t){continue;}
        var et=getSubTeacher(e)||e.teacherName||'미정';
        if(et!==teacher){continue;}
        if(isValidTime(e.endTime)){
          var eIdx=TIMES.indexOf(e.endTime);
          if(eIdx>maxEndIdx){maxEndIdx=eIdx;}
        }
      }
      if(maxEndIdx>ti){
        for(ri=ti+1;ri<maxEndIdx&&ri<TIMES.length;ri++){
          skipMap[teacher+'|'+ri]=true;
        }
      }
    }
  }
  var tbody=document.createElement('tbody');
  for(ti=0;ti<TIMES.length;ti++){
    var time=TIMES[ti],hh=parseInt(time),mm=time.split(':')[1];
    var isHour=mm==='00',isHalf=mm==='30';
    var pm=hh>=12?'오후':'오전',dh=hh>12?hh-12:hh;
    var tr=document.createElement('tr');
    var td0=document.createElement('td');
    td0.className='dv-td-tm'+(isHour?' hour':isHalf?' half':'');
    if(isHour){td0.textContent=pm+' '+dh+':00';}
    else if(isHalf){td0.textContent=dh+':30';}
    else{td0.textContent=':'+mm;}
    tr.appendChild(td0);
    teachers.forEach(function(teacher){
      if(skipMap[teacher+'|'+ti]){return;}
      var sl=entries.filter(function(e){
        return e.time===time&&(getSubTeacher(e)||e.teacherName||'미정')===teacher;
      });
     var td=document.createElement('td');
td.className='dv-td-sl'+(isHour?' hour':isHalf?' half':'');
td.style.verticalAlign='top';
td.style.padding='0';
td.style.position='relative';
td.style.height='1px';
      var maxEndIdx2=ti;
      for(ei=0;ei<sl.length;ei++){
        if(isValidTime(sl[ei].endTime)){
          var eIdx2=TIMES.indexOf(sl[ei].endTime);
          if(eIdx2>maxEndIdx2){maxEndIdx2=eIdx2;}
        }
      }
      var rs=maxEndIdx2-ti;
      if(rs>1){td.rowSpan=rs;}
      sl.forEach(function(e){td.appendChild(buildCard(e,di,rs>1));});
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);
  return tbl;
}
function generateDvCanvas(){
  var day=dvDay,date=dvDate,entries=dvEntries,teachers=dvTeachers;
  var S=2,F='"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
  var TW=66,CW=128,LH=70,TH=34,FH=40,SLOT=20;
  var di=DAYS.indexOf(day),dc=DAY_COLORS[di]||'#4299e1';

  var timeY={},tb=LH+TH;
  for(var i=0;i<TIMES.length;i++){timeY[TIMES[i]]=tb;tb+=SLOT;}

  var W=TW+teachers.length*CW;
  var H=LH+TH+TIMES.length*SLOT+FH;
  var canvas=document.createElement('canvas');
  canvas.width=W*S;canvas.height=H*S;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  var ctx=canvas.getContext('2d');
  ctx.scale(S,S);

  ctx.fillStyle='#f0f4f8';ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#1a202c';ctx.fillRect(0,0,W,LH);
  ctx.fillStyle=dc;ctx.fillRect(0,0,5,LH);
  ctx.fillStyle='white';ctx.font='bold 16px '+F;ctx.fillText('베스트보컬&댄스',14,28);
  ctx.fillStyle=dc;ctx.font='bold 13px '+F;ctx.fillText(day+'요일 스케줄표',14,48);
  ctx.fillStyle='#a0aec0';ctx.font='11px '+F;ctx.textAlign='right';
  ctx.fillText((date.getMonth()+1)+'월 '+date.getDate()+'일  수업 '+entries.length+'개',W-12,30);
  var now=new Date();
  var mm2=now.getMonth()+1;var dd2=now.getDate();
  ctx.fillText(now.getFullYear()+'.'+(mm2<10?'0':'')+mm2+'.'+(dd2<10?'0':'')+dd2,W-12,48);
  ctx.textAlign='left';

  ctx.fillStyle='#1a202c';ctx.fillRect(0,LH,TW,TH);
  ctx.fillStyle='#718096';ctx.font='9px '+F;ctx.textAlign='center';
  ctx.fillText('시간',TW/2,LH+21);ctx.textAlign='left';
  teachers.forEach(function(tc,tIdx){
    var x=TW+tIdx*CW;
    ctx.fillStyle=dc;ctx.fillRect(x,LH,CW,3);
    ctx.fillStyle='#f7fafc';ctx.fillRect(x,LH+3,CW,TH-3);
    ctx.strokeStyle='#e2e8f0';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(x,LH);ctx.lineTo(x,LH+TH);ctx.stroke();
    var cnt=entries.filter(function(e){return(getSubTeacher(e)||e.teacherName||'미정')===tc;}).length;
    ctx.fillStyle='#2d3748';ctx.font='bold 11px '+F;ctx.textAlign='center';
    ctx.fillText(tc+'T ('+cnt+')',x+CW/2,LH+22);ctx.textAlign='left';
  });

  for(var ti=0;ti<TIMES.length;ti++){
    var time=TIMES[ti],ty=timeY[time];
    var hh=parseInt(time),mmStr=time.split(':')[1];
    var isHour=mmStr==='00',isHalf=mmStr==='30';
    var pm=hh>=12?'오후':'오전',dh=hh>12?hh-12:hh;
    ctx.fillStyle=isHour?'#e2e8f0':isHalf?'#f0f4f8':'#edf2f7';
    ctx.fillRect(0,ty,TW,SLOT);
    if(isHour){
      ctx.strokeStyle='#cbd5e0';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(0,ty);ctx.lineTo(W,ty);ctx.stroke();
      ctx.fillStyle='#2d3748';ctx.font='bold 10px '+F;ctx.textAlign='right';
      ctx.fillText(pm+' '+dh+':00',TW-5,ty+14);ctx.textAlign='left';
    } else if(isHalf){
      ctx.strokeStyle='#dde3ea';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(0,ty);ctx.lineTo(W,ty);ctx.stroke();
      ctx.fillStyle='#4a5568';ctx.font='9px '+F;ctx.textAlign='right';
      ctx.fillText(dh+':30',TW-5,ty+14);ctx.textAlign='left';
    } else {
      ctx.strokeStyle='#edf2f7';ctx.lineWidth=0.5;
      ctx.beginPath();ctx.moveTo(0,ty);ctx.lineTo(W,ty);ctx.stroke();
      ctx.fillStyle='#a0aec0';ctx.font='8px '+F;ctx.textAlign='right';
      ctx.fillText(':'+mmStr,TW-5,ty+13);ctx.textAlign='left';
    }
    teachers.forEach(function(tc,tIdx){
      var x=TW+tIdx*CW;
      ctx.fillStyle=tIdx%2===0?'white':'#f9fafb';
      ctx.fillRect(x,ty,CW,SLOT);
      if(isHour){ctx.strokeStyle='#e2e8f0';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,ty);ctx.lineTo(x+CW,ty);ctx.stroke();}
      ctx.strokeStyle='#e2e8f0';ctx.lineWidth=0.5;
      ctx.beginPath();ctx.moveTo(x,ty);ctx.lineTo(x,ty+SLOT);ctx.stroke();
    });
  }

  teachers.forEach(function(tc,tIdx){
    var x=TW+tIdx*CW,P=3;
    var teEntries=entries.filter(function(e){return(getSubTeacher(e)||e.teacherName||'미정')===tc;});
    var byTime={};
    teEntries.forEach(function(e){if(!byTime[e.time])byTime[e.time]=[];byTime[e.time].push(e);});

    Object.keys(byTime).forEach(function(time){
      if(timeY[time]===undefined)return;
      var sl=byTime[time],startY=timeY[time],cy=startY+2;
      sl.forEach(function(e){
        var c=colorFor(e),st=getStatus(e);

        var bH=SLOT*5-4;
        if(isValidTime(e.endTime)&&timeY[e.endTime]!==undefined){
          bH=timeY[e.endTime]-startY-4;
        }
        bH=Math.max(bH,36);

        var isCancel=st==='당일결강'||st==='취소';
        var bg=isCancel?'#fff5f5':st==='보강'?'#fffbeb':st==='보강완료'?'#f0fff4':c.bg;
        var br=isCancel?'#fc8181':st==='보강'?'#f6ad55':st==='보강완료'?'#68d391':c.bdr;

        ctx.fillStyle=bg;ctx.fillRect(x+P,cy,CW-P*2,bH);
        ctx.fillStyle=br;ctx.fillRect(x+P,cy,3,bH);

        ctx.fillStyle=isCancel?'#c53030':c.txt;ctx.font='bold 12px '+F;
        var nm=e.studentName+(e.oneTime?' (1회)':'');
        while(ctx.measureText(nm).width>CW-20&&nm.length>1){nm=nm.slice(0,-1);}
        ctx.fillText(nm,x+P+5,cy+14);

        ctx.fillStyle='#718096';ctx.font='10px '+F;
        var ct=e.classType||'';
        while(ctx.measureText(ct).width>CW-16&&ct.length>1){ct=ct.slice(0,-1);}
        ctx.fillText(ct,x+P+5,cy+27);

        if(isValidTime(e.endTime)){
          ctx.fillStyle='#a0aec0';ctx.font='8px '+F;
          ctx.fillText(e.time+'~'+e.endTime,x+P+5,cy+39);
        }
        var subT=getSubTeacher(e);
        if(subT){ctx.fillStyle='#b7791f';ctx.font='bold 9px '+F;ctx.fillText('대강:'+subT,x+P+5,cy+40);}

        if(st!=='정상'){
var stx=st==='당일결강'?'[결강]':st==='취소'?'[취소]':st==='보강'?'[결강]':st==='보강완료'?'[완료]':'['+st+']';
          ctx.fillStyle=isCancel?'#c53030':st==='보강'?'#b7791f':'#276749';
          ctx.font='bold 8px '+F;ctx.textAlign='right';
          ctx.fillText(stx,x+CW-P-2,cy+12);ctx.textAlign='left';
        }
        cy+=bH+4;
      });
    });
  });

  var fy=LH+TH+TIMES.length*SLOT;
  ctx.fillStyle='#2d3748';ctx.fillRect(0,fy,W,FH);
  ctx.fillStyle='#a0aec0';ctx.font='10px '+F;ctx.fillText('총 '+entries.length+'개 수업',12,fy+25);
  ctx.fillStyle='#63b3ed';ctx.textAlign='right';ctx.font='bold 11px '+F;
  ctx.fillText('베스트보컬&댄스',W-12,fy+25);ctx.textAlign='left';
  return canvas;
}

function createDanceFolders(){
  if(!dvDate){alert('날짜를 선택해주세요');return;}
  var dateStr=fmtDate(dvDate);
  var btn=document.getElementById('df-create-btn');
  var orig=btn.textContent;
  btn.disabled=true;
  btn.textContent='⏳ 생성중...';
  
  try{
    google.script.run
      .withSuccessHandler(function(result){
        btn.disabled=false;
        btn.textContent=orig;
        if(!result||!result.ok){
          alert('❌ 오류가 발생했어요\n\n'+(result&&result.error?result.error:'알 수 없는 오류'));
          return;
        }
        showDfModal(result);
      })
      .withFailureHandler(function(err){
        btn.disabled=false;
        btn.textContent=orig;
        alert('❌ 통신 오류\n\n'+(err.message||err));
      })
      .createDanceFoldersForDate(dateStr);
  }catch(ex){
    btn.disabled=false;
    btn.textContent=orig;
    alert('❌ 실행 오류: '+ex.message);
  }
}

function showDfModal(result){
  document.getElementById('df-title').textContent='📁 영상 폴더 생성 결과';
  document.getElementById('df-sub').textContent=result.dateFolderName||'';
  var body=document.getElementById('df-body');
  body.innerHTML='';
  
  // 댄스 수업이 없을 때
  if(result.message){
    body.innerHTML='<div class="df-empty"><span class="df-empty-emoji">🩰</span>'+escapeHtml(result.message)+'</div>';
    document.getElementById('df-modal-bg').classList.add('show');
    return;
  }
  
  // 새로 만들어진 폴더
  if(result.created&&result.created.length>0){
    var s1=document.createElement('div');
    s1.className='df-section';
    s1.innerHTML='<div class="df-section-title created">🆕 새로 만든 폴더 ('+result.created.length+'개)</div>';
    var l1=document.createElement('div');
    l1.className='df-list';
    result.created.forEach(function(name){
      var item=document.createElement('div');
      item.className='df-item';
      item.innerHTML='<span style="color:#276749;">●</span> '+escapeHtml(name);
      l1.appendChild(item);
    });
    s1.appendChild(l1);
    body.appendChild(s1);
  }
  
  // 이미 있는 폴더
  if(result.skipped&&result.skipped.length>0){
    var s2=document.createElement('div');
    s2.className='df-section';
    s2.innerHTML='<div class="df-section-title skipped">⏭ 이미 있는 폴더 ('+result.skipped.length+'개)</div>';
    var l2=document.createElement('div');
    l2.className='df-list';
    result.skipped.forEach(function(name){
      var item=document.createElement('div');
      item.className='df-item';
      item.style.color='#718096';
      item.innerHTML='<span style="color:#a0aec0;">○</span> '+escapeHtml(name);
      l2.appendChild(item);
    });
    s2.appendChild(l2);
    body.appendChild(s2);
  }
  
  // 오류
  if(result.errors&&result.errors.length>0){
    var s3=document.createElement('div');
    s3.className='df-section';
    s3.innerHTML='<div class="df-section-title errors">⚠️ 오류 ('+result.errors.length+'개)</div>';
    var l3=document.createElement('div');
    l3.className='df-list';
    result.errors.forEach(function(err){
      var item=document.createElement('div');
      item.className='df-item';
      item.style.color='#c53030';
      item.innerHTML='<span style="color:#fc8181;">✗</span> '+escapeHtml(err);
      l3.appendChild(item);
    });
    s3.appendChild(l3);
    body.appendChild(s3);
  }
  
  if((!result.created||!result.created.length)&&(!result.skipped||!result.skipped.length)){
    body.innerHTML='<div class="df-empty"><span class="df-empty-emoji">🩰</span>이 날에 댄스 수업이 없어요</div>';
  }
  
  document.getElementById('df-modal-bg').classList.add('show');

function scrollToToday(){
  if(!isCurrentWeek()){return;}
  var todayIdx=new Date().getDay();
  if(todayIdx<1||todayIdx>6){return;}
  var todayDayName=DAYS[todayIdx-1];
  
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      var scrollEl=document.getElementById('weekly-scroll');
      if(!scrollEl){return;}
      var dayHeaders=scrollEl.querySelectorAll('.th-day');
      if(dayHeaders.length===0){return;}
      
      var targetTh=null,i;
      for(i=0;i<dayHeaders.length;i++){
        var txt=dayHeaders[i].textContent||'';
        if(txt.indexOf(todayDayName+'요일')===0){
          targetTh=dayHeaders[i];
          break;
        }
      }
      if(!targetTh){return;}
      
      try{
        targetTh.scrollIntoView({behavior:'auto',block:'nearest',inline:'start'});
        setTimeout(function(){
          if(scrollEl.scrollLeft>52){
            scrollEl.scrollLeft=scrollEl.scrollLeft-52;
          }
        },50);
      }catch(ex){
        var scrollRect=scrollEl.getBoundingClientRect();
        var thRect=targetTh.getBoundingClientRect();
        var targetScrollLeft=scrollEl.scrollLeft+(thRect.left-scrollRect.left)-52;
        scrollEl.scrollLeft=Math.max(0,targetScrollLeft);
      }
    });
  });
}

function openModal(entry){
  editingId=entry?entry.id:null;
  document.getElementById('modal-title').textContent=entry?'수업 수정':'수업 추가';
  document.getElementById('f-student').value=entry?entry.studentName:'';
  document.getElementById('f-teacher').value=entry?entry.teacherName:'';
  document.getElementById('f-day').value=entry?entry.day:'월';
  document.getElementById('f-onetime').checked=entry?!!entry.oneTime:false;
  if(entry){
    var sel=document.getElementById('f-class'),found=false,i;
    for(i=0;i<sel.options.length;i++){
      if(sel.options[i].value===entry.classType){sel.value=entry.classType;found=true;break;}
    }
    if(!found){
      sel.value='직접입력';
      document.getElementById('f-class-custom').value=entry.classType;
      document.getElementById('f-class-custom-row').style.display='';
    }else{
      document.getElementById('f-class-custom-row').style.display='none';
    }
  }else{
    document.getElementById('f-class').value='보컬_키즈';
    document.getElementById('f-class-custom-row').style.display='none';
  }
  applyForceOneTime(document.getElementById('f-class').value);
  fillStartTimes();
  var sv=entry?entry.time:'15:00';
  document.getElementById('f-time').value=sv;
  fillEndTimes(sv);
  if(entry&&isValidTime(entry.endTime)){
    var etSel=document.getElementById('f-endtime');
    var etOpt=etSel.querySelector('option[value="'+entry.endTime+'"]');
    if(etOpt){etSel.value=entry.endTime;}
  }
  document.getElementById('f-memo').value=entry?(entry.memo||''):'';

  setTimeout(function(){document.getElementById('f-student').focus();},100);
}

      schedule[idx]=Object.assign({},schedule[idx],{studentName:sn,teacherName:tn,classType:cls,day:day,time:time,endTime:endTime,oneTime:oneTime,memo:memo,updatedAt:Date.now()});

function renderLogResults(results,entry){
  var body=document.getElementById('log-body');
  body.innerHTML='';
  if(!results||results.length===0){
    body.innerHTML='<div class="log-empty">아직 기록된 수업 일지가 없어요<br><span style="font-size:10px;color:#cbd5e0;">카톡 출석봇으로 기록하면 여기에 쌓여요</span></div>';
    return;
  }
  var byDate={};
  results.forEach(function(r){
    if(!byDate[r.date])byDate[r.date]=[];
    byDate[r.date].push(r);
  });
  var dates=Object.keys(byDate).sort(function(a,b){return b.localeCompare(a);});
  dates.forEach(function(date){
    var items=byDate[date];
    var entryDiv=document.createElement('div');
    entryDiv.className='log-entry';
    var statuses=items.map(function(x){return x.status;});
    var leftColor='#cbd5e0';
    if(statuses.indexOf('당일취소보강')>=0||statuses.indexOf('당일취소인정')>=0)leftColor='#fc8181';
    else if(statuses.indexOf('완료')>=0||statuses.indexOf('보강완료')>=0)leftColor='#68d391';
    else if(statuses.indexOf('보강')>=0)leftColor='#f6ad55';
    else if(statuses.indexOf('수업내용')>=0||statuses.indexOf('특이사항')>=0)leftColor='#63b3ed';
    entryDiv.style.borderLeftColor=leftColor;
    var dateDiv=document.createElement('div');
    dateDiv.className='log-entry-date';
    var dateLabel=formatLogDate(date);
    var chipsHtml='';
    items.forEach(function(it){
      var chipColor=getStatusChipColor(it.status);
      chipsHtml+='<span class="log-status-chip" style="background:'+chipColor.bg+';color:'+chipColor.txt+';">'+getStatusLabel(it.status)+'</span>';
    });
    dateDiv.innerHTML=dateLabel+' '+chipsHtml;
    entryDiv.appendChild(dateDiv);
    if(items[0].responseTime){
      var timeDiv=document.createElement('div');
      timeDiv.className='log-entry-time';
      timeDiv.textContent='기록: '+items[0].responseTime;
      entryDiv.appendChild(timeDiv);
    }
    items.forEach(function(it){
      if(it.memo&&it.memo.trim()){
        var memoDiv=document.createElement('div');
        memoDiv.className='log-entry-memo';
        var label=it.status==='수업내용'?'📝 수업 내용':it.status==='특이사항'?'💬 특이사항':it.status==='보강'?'📅 보강 예정':'';
        memoDiv.innerHTML=(label?'<b style="color:'+leftColor+';">'+label+':</b> ':'')+escapeHtml(it.memo);
        entryDiv.appendChild(memoDiv);
      }
    });
    body.appendChild(entryDiv);
  });
}
function formatLogDate(dateStr){
  var parts=dateStr.split('-');
  var d=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
  var dn=['일','월','화','수','목','금','토'][d.getDay()];
  var today=new Date();today.setHours(0,0,0,0);
  var diff=Math.round((today-d)/(1000*60*60*24));
  var extra=diff===0?' (오늘)':diff===1?' (어제)':diff===-1?' (내일)':'';
  return (d.getMonth()+1)+'/'+d.getDate()+' ('+dn+')'+extra;
}
function getStatusLabel(s){
  if(s==='완료'||s==='보강완료')return '✅ 완료';
  if(s==='당일취소보강')return '❌ 취소(보강)';
  if(s==='당일취소인정')return '❌ 취소(인정)';
  if(s==='보강')return '📅 보강예정';
  if(s==='수업내용')return '📝 수업내용';
  if(s==='특이사항')return '💬 특이사항';
  return s;
}
function getStatusChipColor(s){
  if(s==='완료'||s==='보강완료')return {bg:'#c6f6d5',txt:'#22543d'};
  if(s==='당일취소보강'||s==='당일취소인정')return {bg:'#fed7d7',txt:'#742a2a'};
  if(s==='보강')return {bg:'#feebc8',txt:'#7b341e'};
  if(s==='수업내용')return {bg:'#bee3f8',txt:'#2a4365'};
  if(s==='특이사항')return {bg:'#e9d8fd',txt:'#44337a'};
  return {bg:'#edf2f7',txt:'#4a5568'};
}

    var newM={id:uid(),name:name,type:type,phone:phone,token:token,active:true};
    members.push(newM);
    google.script.run.withSuccessHandler(function(){
      document.getElementById('m-name').value='';
      document.getElementById('m-phone').value='';
      renderMemberList();
      fetchUrlAndCopy(token);
    }).saveMembers(JSON.stringify(members));
  }).makeToken();
}
function toggleMember(idx){
  var m=members[idx];if(!m){return;}
  var cur=m.active===true||m.active==='TRUE'||m.active==='true'||m.active===1;
  members[idx]=Object.assign({},m,{active:!cur});
  google.script.run.withSuccessHandler(function(){renderMemberList();}).saveMembers(JSON.stringify(members));
}
function copyMemberLink(idx){var m=members[idx];if(!m){return;}fetchUrlAndCopy(m.token);}
function fetchUrlAndCopy(token){
  if(appUrl){doCopyLink(token);return;}
  google.script.run.withSuccessHandler(function(url){appUrl=url;doCopyLink(token);}).getAppUrl();
}
function doCopyLink(token){
  var link=appUrl+'?token='+token;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(function(){
      showSave(false,'링크 복사됨! 카톡으로 보내주세요 😊');
    }).catch(function(){prompt('링크를 복사하세요:',link);});
  } else {prompt('링크를 복사하세요:',link);}
}
/* ════════════════════════════════════════════
   겹침수업 렌더링 패치
   - 같은 강사의 수업 시간이 겹칠 때 rowspan이 어긋나
     검은 셀/카드 사라짐이 생기는 버그 수정
   - 겹치는 수업을 하나의 셀에 카드 여러 장으로 표시
   ════════════════════════════════════════════ */
function computeBlocks(entryList,keyPrefix,skipMap,blockMap){
  var ends={},ei,si,eIdx,k;
  for(ei=0;ei<entryList.length;ei++){
    var e=entryList[ei];
    si=TIMES.indexOf(e.time);
    if(si<0){continue;}
    eIdx=isValidTime(e.endTime)?TIMES.indexOf(e.endTime):-1;
    if(eIdx<=si){eIdx=si+1;}
    if(!ends[si]||eIdx>ends[si]){ends[si]=eIdx;}
  }
  var ti=0;
  while(ti<TIMES.length){
    if(ends[ti]){
      var spanEnd=ends[ti],changed=true;
      while(changed){
        changed=false;
        for(k=ti+1;k<spanEnd&&k<TIMES.length;k++){
          if(ends[k]&&ends[k]>spanEnd){spanEnd=ends[k];changed=true;}
        }
      }
      if(spanEnd>TIMES.length){spanEnd=TIMES.length;}
      blockMap[keyPrefix+ti]=spanEnd;
      for(k=ti+1;k<spanEnd;k++){skipMap[keyPrefix+k]=true;}
      ti=spanEnd;
    }else{ti++;}
  }
}

function renderWeeklyGrid(){
  var vs=visibleSchedule();
  var dayTeachers={};
  var di,ti,tj,ei;
  for(di=0;di<DAYS.length;di++){
    var day=DAYS[di];var tlist=[];
    for(ei=0;ei<vs.length;ei++){
      var e=vs[ei];if(e.day!==day){continue;}
      var tn=getSubTeacher(e)||e.teacherName||'미정';
      if(tlist.indexOf(tn)<0){tlist.push(tn);}
    }
    tlist.sort();dayTeachers[day]=tlist;
  }
  var skipMap={},blockMap={};
  for(di=0;di<DAYS.length;di++){
    var day=DAYS[di];var teachers=dayTeachers[day];
    for(tj=0;tj<teachers.length;tj++){
      var teacher=teachers[tj];
      var tEntries=[];
      for(ei=0;ei<vs.length;ei++){
        var e=vs[ei];
        if(e.day===day&&(getSubTeacher(e)||e.teacherName||'미정')===teacher){tEntries.push(e);}
      }
      computeBlocks(tEntries,day+'|'+teacher+'|',skipMap,blockMap);
    }
  }
  var tbl=document.createElement('table');tbl.className='schedule-table';
  var thead=document.createElement('thead'),tr1=document.createElement('tr');
  var corner=document.createElement('th');corner.className='th-corner';corner.rowSpan=2;corner.textContent='시간';tr1.appendChild(corner);
  for(di=0;di<DAYS.length;di++){
    var day=DAYS[di];var teachers=dayTeachers[day];if(!teachers.length){continue;}
    var date=getDayDate(currentWeekMonday,day);var sc=0;
    for(ei=0;ei<vs.length;ei++){if(vs[ei].day===day){sc++;}}
    var th=document.createElement('th');th.colSpan=teachers.length;th.className='th-day d'+di;
    th.innerHTML=day+'요일 &nbsp;'+fmtDateShort(date)+'&nbsp; 강사'+teachers.length+'/수업'+sc+'개';
    th.title='클릭 → 스케줄 이미지';
    th.onclick=(function(d,dt){return function(){openDayViewModal(d,dt);};})(day,date);
    tr1.appendChild(th);
    var sep=document.createElement('th');sep.className='th-sep';sep.rowSpan=2;tr1.appendChild(sep);
  }
  thead.appendChild(tr1);
  var tr2=document.createElement('tr');
  for(di=0;di<DAYS.length;di++){
    var day=DAYS[di];var teachers=dayTeachers[day];if(!teachers.length){continue;}
    for(tj=0;tj<teachers.length;tj++){
      var cnt=0;for(ei=0;ei<vs.length;ei++){var e=vs[ei];if(e.day===day&&(getSubTeacher(e)||e.teacherName||'미정')===teachers[tj]){cnt++;}}
      var th2=document.createElement('th');th2.className='th-teacher d'+di;
      th2.innerHTML=teachers[tj]+'T <span style="font-size:8px;font-weight:400;color:#718096;">('+cnt+')</span>';
      tr2.appendChild(th2);
    }
  }
  thead.appendChild(tr2);tbl.appendChild(thead);
  var tbody=document.createElement('tbody');
  var q=currentSearch?currentSearch.toLowerCase():'';
  for(ti=0;ti<TIMES.length;ti++){
    var time=TIMES[ti],hh=parseInt(time),mm=time.split(':')[1];
    var isHour=mm==='00',isHalf=mm==='30';
    var pm=hh>=12?'오후':'오전',dh=hh>12?hh-12:hh;
    var tr=document.createElement('tr');
    var td0=document.createElement('td');
    td0.className='td-time'+(isHour?' hour':isHalf?' half':'');
    if(isHour){td0.textContent=pm+' '+dh+':00';}else if(isHalf){td0.textContent=dh+':30';}else{td0.textContent=':'+mm;}
    tr.appendChild(td0);
    for(di=0;di<DAYS.length;di++){
      var day=DAYS[di];var teachers=dayTeachers[day];if(!teachers.length){continue;}
      for(tj=0;tj<teachers.length;tj++){
        var teacher=teachers[tj];
        var key=day+'|'+teacher+'|';
        if(skipMap[key+ti]){continue;}
        var blockEnd=blockMap[key+ti]||0;
        var entries=[];
        if(blockEnd){
          for(ei=0;ei<vs.length;ei++){
            var e=vs[ei];
            if(e.day!==day){continue;}
            if((getSubTeacher(e)||e.teacherName||'미정')!==teacher){continue;}
            var sIdx=TIMES.indexOf(e.time);
            if(sIdx>=ti&&sIdx<blockEnd){entries.push(e);}
          }
          entries.sort(function(a,b){return a.time.localeCompare(b.time);});
        }
        var td=document.createElement('td');
        td.className='td-slot d'+di+(isHour?' hour':isHalf?' half':'');
        td.style.verticalAlign='top';
        td.style.padding='0';
        td.style.position='relative';
        if(q&&entries.length>0){for(ei=0;ei<entries.length;ei++){if(matchSearch(entries[ei].studentName,q)||matchSearch(entries[ei].teacherName,q)){td.classList.add('search-hi');break;}}}
        var rs=blockEnd?blockEnd-ti:0;
        if(rs>1){td.rowSpan=rs;}
        for(ei=0;ei<entries.length;ei++){td.appendChild(buildCard(entries[ei],di,rs>1&&entries.length===1));}
        if(entries.length===0){
          td.style.cursor='pointer';
          td.style.height='1px';
          td.onclick=(function(d,tm){return function(){openModalPrefill(d,tm);};})(day,time);
        }
        tr.appendChild(td);
      }
      var sep2=document.createElement('td');sep2.className='td-sep';tr.appendChild(sep2);
    }
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);
  var container=document.getElementById('weekly-container');container.innerHTML='';container.appendChild(tbl);
  scrollToToday();
}

function buildDvTable(day,date,teachers,entries){
  var di=DAYS.indexOf(day),dc=DAY_COLORS[di]||'#4299e1';
  var tbl=document.createElement('table');
  tbl.className='dv-tbl';
  var capTr=document.createElement('tr');
  capTr.className='dv-cap-row';
  var capTd=document.createElement('td');
  capTd.colSpan=teachers.length+1;
  capTd.innerHTML='<span style="color:white;font-size:15px;font-weight:800;">베스트보컬&댄스</span><span style="color:'+dc+';font-size:13px;font-weight:700;margin-left:10px;">'+day+'요일 스케줄</span><span style="color:#a0aec0;font-size:11px;float:right;margin-top:3px;">'+fmtDateShort(date)+'</span>';
  capTr.appendChild(capTd);
  var thead=document.createElement('thead');
  thead.appendChild(capTr);
  var trh=document.createElement('tr');
  var co=document.createElement('th');
  co.className='dv-th-c';co.textContent='시간';trh.appendChild(co);
  teachers.forEach(function(teacher){
    var cnt=entries.filter(function(e){return(getSubTeacher(e)||e.teacherName||'미정')===teacher;}).length;
    var th=document.createElement('th');
    th.className='dv-th-t';
    th.style.borderTop='3px solid '+dc;
    th.innerHTML=teacher+'T <span style="font-size:9px;color:#718096;font-weight:400;">('+cnt+'개)</span>';
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  tbl.appendChild(thead);
  var skipMap={},blockMap={},tj,ti,ei;
  for(tj=0;tj<teachers.length;tj++){
    var teacher=teachers[tj];
    var tEntries=[];
    for(ei=0;ei<entries.length;ei++){
      var e=entries[ei];
      if((getSubTeacher(e)||e.teacherName||'미정')===teacher){tEntries.push(e);}
    }
    computeBlocks(tEntries,teacher+'|',skipMap,blockMap);
  }
  var tbody=document.createElement('tbody');
  for(ti=0;ti<TIMES.length;ti++){
    var time=TIMES[ti],hh=parseInt(time),mm=time.split(':')[1];
    var isHour=mm==='00',isHalf=mm==='30';
    var pm=hh>=12?'오후':'오전',dh=hh>12?hh-12:hh;
    var tr=document.createElement('tr');
    var td0=document.createElement('td');
    td0.className='dv-td-tm'+(isHour?' hour':isHalf?' half':'');
    if(isHour){td0.textContent=pm+' '+dh+':00';}
    else if(isHalf){td0.textContent=dh+':30';}
    else{td0.textContent=':'+mm;}
    tr.appendChild(td0);
    teachers.forEach(function(teacher){
      if(skipMap[teacher+'|'+ti]){return;}
      var blockEnd=blockMap[teacher+'|'+ti]||0;
      var sl=[];
      if(blockEnd){
        for(var k=0;k<entries.length;k++){
          var e=entries[k];
          if((getSubTeacher(e)||e.teacherName||'미정')!==teacher){continue;}
          var sIdx=TIMES.indexOf(e.time);
          if(sIdx>=ti&&sIdx<blockEnd){sl.push(e);}
        }
        sl.sort(function(a,b){return a.time.localeCompare(b.time);});
      }
      var td=document.createElement('td');
      td.className='dv-td-sl'+(isHour?' hour':isHalf?' half':'');
      td.style.verticalAlign='top';
      td.style.padding='0';
      td.style.position='relative';
      td.style.height='1px';
      var rs=blockEnd?blockEnd-ti:0;
      if(rs>1){td.rowSpan=rs;}
      sl.forEach(function(e){td.appendChild(buildCard(e,di,rs>1&&sl.length===1));});
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);
  return tbl;
}

  var lastReloadAt = Date.now();

  function softReload(){
    var now = Date.now();
    if (now - lastReloadAt < MIN_INTERVAL) return;
    if (window.__bvdSaving || bvdDirty || document.querySelector(".modal-bg.show")) return; // 저장 중엔 새로고침 건너뜀
    lastReloadAt = now;
    if (typeof reloadData === 'function') { try{ reloadData(true); }catch(e){} }
  }
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) softReload();
  });
  window.addEventListener('focus', softReload);
  window.addEventListener('pageshow', function(ev){
    if (ev.persisted) softReload(); // bfcache에서 돌아올 때
  });
})();
